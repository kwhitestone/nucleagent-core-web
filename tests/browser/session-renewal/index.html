<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthetic session renewal regression</title>
<style>html,body,iframe { margin:0; width:100%; height:100%; border:0; display:block; }</style>
<iframe id="consumer" title="Synthetic editor"></iframe>
<script type="module">
  import { authIntent } from "shell-auth-intent";
  const frame = document.querySelector("iframe");
  const instanceId = crypto.randomUUID();
  const send = (type, payload) => frame.contentWindow.postMessage({
    protocol: "prism-fusion/remote", version: 1, appId: "core", instanceId, type, payload,
  }, location.origin);
  const grants = ["core:admin:read", "core:admin:write"];
  const auth = (version = 1, credential = "synthetic-session-one", permissions = grants, userInfoId = 41) =>
    send("auth", authIntent(credential ?? "", version, permissions, userInfoId));
  window.addEventListener("message", event => {
    if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
    if (event.data?.fixtureReady) send("host:init");
    if (event.data?.instanceId === instanceId && event.data?.type === "child:ready") auth();
  });
  window.renewalHost = { auth, send, instanceId, grants };
  frame.src = `./child.html${location.search}`;
</script>
</html>
